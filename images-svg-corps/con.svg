<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210">
  <defs>
    <style>
      .solid { stroke: #1a1a1a; stroke-width: 1.8; fill: none; stroke-linecap: round; }
      .hidden { stroke: #1a1a1a; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; stroke-linecap: round; }
      .label { font-family: serif; font-size: 13px; fill: #1a1a1a; font-style: italic; }
      .height { stroke: #555; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    </style>
  </defs>
  <!-- Fata conului (triunghi) cu fill -->
  <polygon points="100,20 40,170 160,170" class="solid" fill="#f0f4ff" fill-opacity="0.6"/>
  <!-- Elipsa de jos - jumatate ascunsa -->
  <path d="M40,170 A60,18 0 0 0 160,170" class="hidden"/>
  <!-- Elipsa de jos - jumatate vizibila -->
  <path d="M40,170 A60,18 0 0 1 160,170" class="solid"/>
  <!-- Varf -->
  <circle cx="100" cy="20" r="2.5" fill="#1a1a1a"/>
  <!-- Inaltimea -->
  <line x1="100" y1="20" x2="100" y2="170" class="height"/>
  <line x1="96" y1="170" x2="104" y2="170" style="stroke:#555;stroke-width:1;fill:none;"/>
  <text x="106" y="102" class="label">h</text>
  <!-- Raza -->
  <line x1="100" y1="170" x2="160" y2="170" class="height"/>
  <text x="122" y="188" class="label">r</text>
  <!-- Generatoarea -->
  <text x="142" y="98" class="label">g</text>
</svg>

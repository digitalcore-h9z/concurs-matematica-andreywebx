<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 230" width="280" height="230">
  <defs>
    <style>
      .plan { stroke: #1a5eb8; stroke-width: 1.4; fill: #dde8ff; fill-opacity: 0.45; stroke-linecap: round; stroke-linejoin: round; }
      .hidden { stroke: #1a5eb8; stroke-width: 1; fill: none; stroke-dasharray: 5 3; }
      .dim { stroke: #555; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .label { font-family: serif; font-size: 13px; fill: #1a1a1a; font-style: italic; }
      .label-blue { font-family: serif; font-size: 13px; fill: #1a5eb8; font-style: italic; }
      .paralel { stroke: #c0392b; stroke-width: 1.8; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Plan alpha (sus) -->
  <polygon points="30,55 190,25 250,65 90,95" class="plan"/>
  <!-- Linii grila alpha -->
  <line x1="30" y1="55" x2="250" y2="65" class="hidden"/>
  <line x1="190" y1="25" x2="90" y2="95" class="hidden"/>
  <text x="230" y="60" class="label-blue">α</text>

  <!-- Plan beta (jos) -->
  <polygon points="20,155 180,125 245,165 85,195" class="plan"/>
  <!-- Linii grila beta -->
  <line x1="20" y1="155" x2="245" y2="165" class="hidden"/>
  <line x1="180" y1="125" x2="85" y2="195" class="hidden"/>
  <text x="225" y="160" class="label-blue">β</text>

  <!-- Sageti paralel (indicatori) -->
  <text x="55" y="73" style="font-size:13px;fill:#c0392b;">›</text>
  <text x="55" y="173" style="font-size:13px;fill:#c0392b;">›</text>
  <text x="160" y="43" style="font-size:13px;fill:#c0392b;">›</text>
  <text x="155" y="143" style="font-size:13px;fill:#c0392b;">›</text>

  <!-- Distanta intre plane -->
  <line x1="265" y1="55" x2="265" y2="165" class="dim"/>
  <line x1="261" y1="55" x2="269" y2="55" style="stroke:#555;stroke-width:1;fill:none;"/>
  <line x1="261" y1="165" x2="269" y2="165" style="stroke:#555;stroke-width:1;fill:none;"/>
  <text x="270" y="115" class="label">d</text>

  <!-- Dreapta perpendiculara pe ambele plane -->
  <line x1="140" y1="60" x2="135" y2="155" class="paralel"/>
  <circle cx="140" cy="60" r="3" fill="#c0392b"/>
  <circle cx="135" cy="155" r="3" fill="#c0392b"/>

  <!-- Explicatie -->
  <text x="20" y="220" style="font-family:serif;font-size:11px;fill:#333;">α ∥ β  (planele nu au niciun punct comun)</text>
</svg>

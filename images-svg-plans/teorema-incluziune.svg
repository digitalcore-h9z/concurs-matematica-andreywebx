<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" width="260" height="210">
  <defs>
    <style>
      .plan { stroke: #1a5eb8; stroke-width: 1.4; fill: #dde8ff; fill-opacity: 0.4; stroke-linecap: round; stroke-linejoin: round; }
      .dreapta { stroke: #c0392b; stroke-width: 2; stroke-linecap: round; }
      .label { font-family: serif; font-size: 12px; fill: #1a1a1a; font-style: italic; }
      .label-red { font-family: serif; font-size: 12px; fill: #c0392b; }
      .label-blue { font-family: serif; font-size: 12px; fill: #1a5eb8; font-style: italic; }
      .dot { fill: #1a1a1a; }
      .dot-red { fill: #c0392b; }
    </style>
  </defs>

  <!-- Planul alpha -->
  <polygon points="20,160 130,120 250,140 140,180" class="plan"/>
  <text x="228" y="137" class="label-blue">α</text>

  <!-- Dreapta d inclusa in plan -->
  <line x1="55" y1="155" x2="210" y2="138" class="dreapta"/>
  <polygon points="210,138 198,133 200,143" fill="#c0392b"/>
  <polygon points="55,155 67,150 65,160" fill="#c0392b"/>
  <text x="222" y="136" class="label-red">d</text>

  <!-- Punctul A pe dreapta si in plan -->
  <circle cx="100" cy="151" r="3.5" class="dot-red"/>
  <text x="96" y="145" class="label-red">A</text>

  <!-- Punctul B pe dreapta si in plan -->
  <circle cx="175" cy="143" r="3.5" class="dot-red"/>
  <text x="171" y="137" class="label-red">B</text>

  <!-- Linii din puncte catre plan (ca sa arate ca sunt in plan) -->
  <line x1="100" y1="151" x2="100" y2="165" style="stroke:#888;stroke-width:1;stroke-dasharray:3 2;fill:none;"/>
  <line x1="175" y1="143" x2="175" y2="157" style="stroke:#888;stroke-width:1;stroke-dasharray:3 2;fill:none;"/>

  <!-- Explicatie -->
  <text x="20" y="25" style="font-family:serif;font-size:11px;fill:#333;">Dacă A ∈ d și A ∈ α</text>
  <text x="20" y="42" style="font-family:serif;font-size:11px;fill:#333;">și B ∈ d și B ∈ α</text>
  <text x="20" y="59" style="font-family:serif;font-size:11px;fill:#333;">(A ≠ B)</text>
  <text x="20" y="76" style="font-family:serif;font-size:11px;fill:#333;">⟹ d ⊂ α</text>
</svg>

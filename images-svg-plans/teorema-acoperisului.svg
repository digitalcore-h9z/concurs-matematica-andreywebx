<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220">
  <defs>
    <style>
      .plan { stroke: #1a1a1a; stroke-width: 1.4; fill-opacity: 0.35; stroke-linecap: round; stroke-linejoin: round; }
      .dreapta { stroke: #c0392b; stroke-width: 2; stroke-linecap: round; }
      .dreapta2 { stroke: #27ae60; stroke-width: 2; stroke-linecap: round; }
      .muche { stroke: #1a1a1a; stroke-width: 1.6; fill: none; stroke-linecap: round; }
      .hidden { stroke: #1a1a1a; stroke-width: 1.1; fill: none; stroke-dasharray: 5 3; }
      .label { font-family: serif; font-size: 12px; fill: #1a1a1a; font-style: italic; }
      .label-red { font-family: serif; font-size: 12px; fill: #c0392b; font-weight: bold; }
      .label-green { font-family: serif; font-size: 12px; fill: #27ae60; font-weight: bold; }
      .label-blue { font-family: serif; font-size: 12px; fill: #1a5eb8; font-style: italic; }
      .dot { fill: #1a1a1a; }
    </style>
  </defs>

  <!-- Plan alpha (stanga) -->
  <polygon points="15,175 115,140 155,160 55,195" class="plan" fill="#dde8ff" stroke="#1a5eb8"/>
  <text x="18" y="193" class="label-blue">α</text>

  <!-- Plan beta (dreapta) -->
  <polygon points="115,140 220,105 255,125 150,160" class="plan" fill="#d5f5e3" stroke="#27ae60"/>
  <text x="238" y="122" class="label-green" style="fill:#1a8a4a;">β</text>

  <!-- Dreapta de intersectie a planelor (d) -->
  <line x1="115" y1="140" x2="155" y2="160" class="muche" style="stroke:#8e44ad;stroke-width:2;"/>
  <text x="128" y="156" style="font-family:serif;font-size:12px;fill:#8e44ad;font-style:italic;">d</text>

  <!-- Varful acoperisului (punctul comun) -->
  <circle cx="185" cy="50" r="3.5" fill="#c0392b"/>
  <text x="190" y="48" class="label-red">A</text>

  <!-- Dreapta a in planul alpha (rosie) -->
  <line x1="55" y1="80" x2="185" y2="50" class="dreapta"/>
  <line x1="185" y1="50" x2="95" y2="165" class="dreapta" style="stroke-dasharray:5 3;"/>
  <text x="48" y="78" class="label-red">a</text>

  <!-- Dreapta b in planul beta (verde) -->
  <line x1="255" y1="85" x2="185" y2="50" class="dreapta2"/>
  <line x1="185" y1="50" x2="150" y2="158" class="dreapta2" style="stroke-dasharray:5 3;"/>
  <text x="258" y="83" class="label-green">b</text>

  <!-- Explicatie -->
  <text x="15" y="22" style="font-family:serif;font-size:11px;fill:#333;">a ⊂ α, b ⊂ β, a ∩ b = {A}</text>
  <text x="15" y="38" style="font-family:serif;font-size:11px;fill:#333;">⟹ dreapta AB ∥ d (α ∩ β)</text>
</svg>

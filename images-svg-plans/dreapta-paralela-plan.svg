<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200">
  <defs>
    <style>
      .solid { stroke: #1a1a1a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .plan { stroke: #1a1a1a; stroke-width: 1.4; fill: #dde8ff; fill-opacity: 0.45; stroke-linecap: round; stroke-linejoin: round; }
      .dreapta { stroke: #c0392b; stroke-width: 2; stroke-linecap: round; }
      .label { font-family: serif; font-size: 13px; fill: #1a1a1a; font-style: italic; }
      .label-red { font-family: serif; font-size: 13px; fill: #c0392b; font-style: italic; }
      .label-plan { font-family: serif; font-size: 13px; fill: #1a5eb8; font-style: italic; }
      .hidden { stroke: #1a1a1a; stroke-width: 1.1; fill: none; stroke-dasharray: 5 3; }
    </style>
  </defs>
  <!-- Planul (paralelogram perspectiva) -->
  <polygon points="20,150 140,110 240,130 120,170" class="plan"/>
  <!-- Linii grila plan -->
  <line x1="20" y1="150" x2="240" y2="130" class="hidden"/>
  <line x1="140" y1="110" x2="120" y2="170" class="hidden"/>
  <!-- Eticheta plan -->
  <text x="220" y="125" class="label-plan">α</text>
  <!-- Dreapta paralela (rosie, deasupra planului) -->
  <line x1="40" y1="55" x2="200" y2="35" class="dreapta"/>
  <!-- Sagetile de la capete ale dreptei -->
  <polygon points="200,35 188,30 190,40" fill="#c0392b"/>
  <polygon points="40,55 52,50 50,60" fill="#c0392b"/>
  <!-- Punct pe dreapta -->
  <circle cx="120" cy="45" r="3" fill="#c0392b"/>
  <text x="124" y="42" class="label-red">d</text>
  <!-- Linii punctate care arata distanta de la dreapta la plan -->
  <line x1="80" y1="52" x2="75" y2="130" style="stroke:#888;stroke-width:1;stroke-dasharray:4 3;fill:none;"/>
  <line x1="160" y1="42" x2="165" y2="122" style="stroke:#888;stroke-width:1;stroke-dasharray:4 3;fill:none;"/>
  <!-- Simboluri paralel -->
  <text x="88" y="88" style="font-size:18px;fill:#555;">∥</text>
  <text x="50" y="108" style="font-family:serif;font-size:11px;fill:#555;font-style:italic;">d ∥ α</text>
</svg>
